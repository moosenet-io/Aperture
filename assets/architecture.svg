<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>Aperture — system architecture</title>
  <defs>
    <radialGradient id="ar-space" cx="50%" cy="28%" r="88%">
      <stop offset="0%" stop-color="#241A3F"/>
      <stop offset="55%" stop-color="#1A1430"/>
      <stop offset="100%" stop-color="#0D0A1C"/>
    </radialGradient>
    <linearGradient id="ar-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221A40"/>
      <stop offset="100%" stop-color="#161130"/>
    </linearGradient>
    <linearGradient id="ar-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C2350"/>
      <stop offset="100%" stop-color="#1A1333"/>
    </linearGradient>
    <marker id="ar-a-blue" markerWidth="8" markerHeight="8" refX="6.4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="ar-a-violet" markerWidth="8" markerHeight="8" refX="6.4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#A855F7"/>
    </marker>
    <marker id="ar-a-green" markerWidth="8" markerHeight="8" refX="6.4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#ar-space)"/>

  <!-- sparse starfield -->
  <g fill="#FFFFFF">
    <circle cx="64" cy="88" r="1.1" opacity="0.4"/><circle cx="196" cy="46" r="0.8" opacity="0.32"/>
    <circle cx="1216" cy="112" r="1.2" opacity="0.45"/><circle cx="1084" cy="44" r="0.9" opacity="0.35"/>
    <circle cx="42" cy="368" r="1.0" opacity="0.38"/><circle cx="1244" cy="392" r="1.1" opacity="0.42"/>
    <circle cx="1160" cy="646" r="0.9" opacity="0.34"/><circle cx="70" cy="640" r="1.2" opacity="0.44"/>
    <circle cx="300" cy="694" r="0.8" opacity="0.3"/><circle cx="990" cy="700" r="0.9" opacity="0.33"/>
    <circle cx="640" cy="24" r="0.8" opacity="0.36"/><circle cx="1248" cy="238" r="0.8" opacity="0.3"/>
  </g>

  <!-- ===== HEADER ===== -->
  <text x="640" y="46" text-anchor="middle" fill="#C4A5FB" fill-opacity="0.8"
        font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace"
        font-size="12" letter-spacing="2.16">CONSTELLATION CLIENT</text>
  <text x="640" y="84" text-anchor="middle" fill="#F4F2FB"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="27" font-weight="600" letter-spacing="1.08">Aperture · System architecture</text>
  <line x1="470" y1="102" x2="810" y2="102" stroke="#A855F7" stroke-opacity="0.22" stroke-width="1"/>

  <!-- ===== CLIENT SURFACES (blue = source) ===== -->
  <text x="190" y="124" fill="#3B82F6" fill-opacity="0.85"
        font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace"
        font-size="10.5" letter-spacing="1.89">CLIENT SURFACES</text>

  <g>
    <rect x="190" y="132" width="260" height="72" rx="12" fill="url(#ar-panel)" stroke="#A855F7" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="212" cy="168" r="4.5" fill="#3B82F6"/>
    <text x="234" y="164" fill="#F4F2FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Web</text>
    <text x="234" y="183" fill="#9CA3AF" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="10">browser SPA</text>
  </g>
  <g>
    <rect x="510" y="132" width="260" height="72" rx="12" fill="url(#ar-panel)" stroke="#A855F7" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="532" cy="168" r="4.5" fill="#3B82F6"/>
    <text x="554" y="164" fill="#F4F2FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Desktop</text>
    <text x="554" y="183" fill="#9CA3AF" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="10">windows + macos</text>
  </g>
  <g>
    <rect x="830" y="132" width="260" height="72" rx="12" fill="url(#ar-panel)" stroke="#A855F7" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="852" cy="168" r="4.5" fill="#3B82F6"/>
    <text x="874" y="164" fill="#F4F2FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Mobile</text>
    <text x="874" y="183" fill="#9CA3AF" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="10">installable pwa</text>
  </g>

  <!-- converge into the BFF -->
  <g stroke="#3B82F6" stroke-width="1.5" opacity="0.55" fill="none">
    <line x1="320" y1="204" x2="560" y2="250" marker-end="url(#ar-a-blue)"/>
    <line x1="640" y1="204" x2="640" y2="250" marker-end="url(#ar-a-blue)"/>
    <line x1="960" y1="204" x2="720" y2="250" marker-end="url(#ar-a-blue)"/>
  </g>
  <g>
    <rect x="576" y="216" width="128" height="24" rx="6" fill="#161130" stroke="#3B82F6" stroke-opacity="0.35" stroke-width="1"/>
    <text x="640" y="232" text-anchor="middle" fill="#93B4F8"
          font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace"
          font-size="10.5" letter-spacing="0.9">SSE + REST</text>
  </g>

  <!-- ===== APERTURE BFF (violet = core) ===== -->
  <rect x="340" y="252" width="600" height="110" rx="14" fill="url(#ar-core)" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1.2"/>
  <circle cx="372" cy="288" r="5" fill="#A855F7"/>
  <text x="392" y="293" fill="#F4F2FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600">Aperture BFF</text>
  <text x="908" y="292" text-anchor="end" fill="#C4A5FB" fill-opacity="0.75"
        font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace"
        font-size="10" letter-spacing="1.8">RUST · PROCESSING CENTRE</text>
  <g font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="10.5">
    <rect x="372" y="312" width="126" height="30" rx="8" fill="#221A40" stroke="#A855F7" stroke-opacity="0.14" stroke-width="1"/>
    <text x="435" y="331" text-anchor="middle" fill="#C7C3D6">session</text>
    <rect x="510" y="312" width="126" height="30" rx="8" fill="#221A40" stroke="#A855F7" stroke-opacity="0.14" stroke-width="1"/>
    <text x="573" y="331" text-anchor="middle" fill="#C7C3D6">stream mux</text>
    <rect x="648" y="312" width="126" height="30" rx="8" fill="#221A40" stroke="#A855F7" stroke-opacity="0.14" stroke-width="1"/>
    <text x="711" y="331" text-anchor="middle" fill="#C7C3D6">view cache</text>
    <rect x="786" y="312" width="122" height="30" rx="8" fill="#221A40" stroke="#A855F7" stroke-opacity="0.14" stroke-width="1"/>
    <text x="847" y="331" text-anchor="middle" fill="#C7C3D6">auth</text>
  </g>

  <line x1="640" y1="362" x2="640" y2="394" stroke="#A855F7" stroke-width="1.6" opacity="0.8" marker-end="url(#ar-a-violet)"/>

  <!-- ===== THE SINGLE DOOR ===== -->
  <rect x="470" y="398" width="340" height="40" rx="10" fill="#1A1333" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1.2"/>
  <circle cx="496" cy="418" r="4" fill="#A855F7"/>
  <text x="646" y="423" text-anchor="middle" fill="#DDC9FD"
        font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace"
        font-size="11" letter-spacing="1.98">ONE SANCTIONED DOOR</text>

  <line x1="640" y1="438" x2="640" y2="466" stroke="#A855F7" stroke-width="1.6" opacity="0.8" marker-end="url(#ar-a-violet)"/>

  <!-- ===== KERNEL (violet = core) ===== -->
  <rect x="340" y="470" width="600" height="76" rx="14" fill="url(#ar-core)" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1.2"/>
  <circle cx="372" cy="508" r="5" fill="#A855F7"/>
  <text x="392" y="504" fill="#F4F2FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Constellation kernel</text>
  <text x="392" y="524" fill="#9CA3AF" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="10" letter-spacing="1.2">TOOL HUB · POLICY · ROUTING</text>

  <!-- fan out to endpoints -->
  <g stroke="#10B981" stroke-width="1.4" opacity="0.45" fill="none">
    <line x1="640" y1="546" x2="226" y2="584" marker-end="url(#ar-a-green)"/>
    <line x1="640" y1="546" x2="502" y2="584" marker-end="url(#ar-a-green)"/>
    <line x1="640" y1="546" x2="778" y2="584" marker-end="url(#ar-a-green)"/>
    <line x1="640" y1="546" x2="1054" y2="584" marker-end="url(#ar-a-green)"/>
  </g>

  <!-- ===== BACKEND ENDPOINTS (green = endpoint) ===== -->
  <g>
    <rect x="100" y="588" width="252" height="86" rx="12" fill="url(#ar-panel)" stroke="#A855F7" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="122" cy="616" r="4.5" fill="#10B981"/>
    <text x="144" y="621" fill="#F4F2FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Inference</text>
    <text x="122" y="642" fill="#9CA3AF" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="9.5">local models · streaming</text>
    <circle cx="126" cy="659" r="3.5" fill="#F59E0B"/>
    <text x="140" y="663" fill="#F59E0B" fill-opacity="0.85" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="9.5">cloud fallback · gated</text>
  </g>
  <g>
    <rect x="376" y="588" width="252" height="86" rx="12" fill="url(#ar-panel)" stroke="#A855F7" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="398" cy="616" r="4.5" fill="#10B981"/>
    <text x="420" y="621" fill="#F4F2FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Build</text>
    <text x="398" y="642" fill="#9CA3AF" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="9.5">orchestrated pipelines</text>
    <text x="398" y="661" fill="#9CA3AF" fill-opacity="0.7" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="9.5">surfaced as Harmony</text>
  </g>
  <g>
    <rect x="652" y="588" width="252" height="86" rx="12" fill="url(#ar-panel)" stroke="#A855F7" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="674" cy="616" r="4.5" fill="#10B981"/>
    <text x="696" y="621" fill="#F4F2FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Media</text>
    <text x="674" y="642" fill="#9CA3AF" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="9.5">library · metadata</text>
    <text x="674" y="661" fill="#9CA3AF" fill-opacity="0.7" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="9.5">surfaced as Muse</text>
  </g>
  <g>
    <rect x="928" y="588" width="252" height="86" rx="12" fill="url(#ar-panel)" stroke="#A855F7" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="950" cy="616" r="4.5" fill="#10B981"/>
    <text x="972" y="621" fill="#F4F2FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Memory</text>
    <text x="950" y="642" fill="#9CA3AF" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="9.5">vectors · recall</text>
    <text x="950" y="661" fill="#9CA3AF" fill-opacity="0.7" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="9.5">surfaced as Assistant</text>
  </g>

  <text x="640" y="702" text-anchor="middle" fill="#4B5563"
        font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace"
        font-size="10" letter-spacing="1.8">THE CLIENT HOLDS NO SECRETS AND REACHES NOTHING DIRECTLY</text>
</svg>
