<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Aperture</title>
  <defs>
    <!-- Violet core gradient: luminous top-left, deep bottom-right -->
    <linearGradient id="ap-blade" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#C4A5FB"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <!-- Light coming through the opening -->
    <radialGradient id="ap-throat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DDC9FD" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ap-housing">
      <circle cx="16" cy="16" r="10.6"/>
    </clipPath>
  </defs>

  <!-- Container: reads on both light and dark pages -->
  <rect x="0" y="0" width="32" height="32" rx="6.5" fill="#110E22"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.2" fill="none" stroke="#A855F7" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Light through the throat, behind the blades -->
  <circle cx="16" cy="16" r="7.6" fill="url(#ap-throat)"/>

  <!-- Diaphragm: six blades, hexagonal opening -->
  <g clip-path="url(#ap-housing)" fill="url(#ap-blade)">
    <path d="M19.9 16 L18.29 12.84 L23.17 -8.99 L40.43 7.11 Z" opacity="0.94"/>
    <path d="M17.95 12.62 L14.41 12.44 L-2.06 -2.7 L20.51 -9.61 Z"/>
    <path d="M14.05 12.62 L12.12 15.59 L-9.23 22.29 L-3.92 -0.71 Z" opacity="0.9"/>
    <path d="M12.1 16 L13.71 19.16 L8.83 40.99 L-8.43 24.89 Z" opacity="0.84"/>
    <path d="M14.05 19.38 L17.59 19.56 L34.06 34.7 L11.49 41.61 Z" opacity="0.8"/>
    <path d="M17.95 19.38 L19.88 16.41 L41.23 9.71 L35.92 32.71 Z" opacity="0.88"/>
  </g>

  <!-- Housing ring -->
  <circle cx="16" cy="16" r="10.6" fill="none" stroke="#A855F7" stroke-opacity="0.4" stroke-width="0.9"/>

  <!-- Core light -->
  <circle cx="16" cy="16" r="1.5" fill="#F4F2FB" opacity="0.92"/>
</svg>
