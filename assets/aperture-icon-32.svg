<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Aperture</title>
  <defs>
    <!-- Alternating blade facets: luminous / deep -->
    <linearGradient id="ap-blade-a" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#C4A5FB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="ap-blade-b" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <!-- Light coming through the opening -->
    <radialGradient id="ap-throat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4F2FB" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#C4A5FB" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ap-housing">
      <circle cx="16" cy="16" r="11.2"/>
    </clipPath>
  </defs>

  <!-- Self-lit container: the mark holds on light or dark pages -->
  <rect x="0" y="0" width="32" height="32" rx="6.5" fill="#110E22"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.2" fill="none" stroke="#A855F7" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Throat light, behind the blades -->
  <circle cx="16" cy="16" r="6.5" fill="url(#ap-throat)"/>

  <!-- Diaphragm: six blades closing on a hexagonal opening -->
  <g clip-path="url(#ap-housing)">
    <path d="M22.2 16 L19.47 10.86 L21.41 -9.43 L40.11 6.26 Z" fill="url(#ap-blade-a)"/>
    <path d="M19.1 10.63 L13.28 10.43 L-3.32 -1.4 L19.62 -9.75 Z" fill="url(#ap-blade-b)"/>
    <path d="M12.9 10.63 L9.82 15.57 L-8.73 24.03 L-4.49 -0.01 Z" fill="url(#ap-blade-a)"/>
    <path d="M9.8 16 L12.53 21.14 L10.59 41.43 L-8.11 25.74 Z" fill="url(#ap-blade-b)"/>
    <path d="M12.9 21.37 L18.72 21.57 L35.32 33.4 L12.38 41.75 Z" fill="url(#ap-blade-a)"/>
    <path d="M19.1 21.37 L22.18 16.43 L40.73 7.97 L36.49 32.01 Z" fill="url(#ap-blade-b)"/>
  </g>

  <!-- Opening edge -->
  <path d="M22.2 16 L19.1 10.63 L12.9 10.63 L9.8 16 L12.9 21.37 L19.1 21.37 Z"
        fill="none" stroke="#DDC9FD" stroke-opacity="0.7" stroke-width="0.35"/>

  <!-- Housing ring -->
  <circle cx="16" cy="16" r="11.2" fill="none" stroke="#A855F7" stroke-opacity="0.4" stroke-width="0.9"/>

  <!-- Core light -->
  <circle cx="16" cy="16" r="1" fill="#F4F2FB" opacity="0.95"/>
</svg>
