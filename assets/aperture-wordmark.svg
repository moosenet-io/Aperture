<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" width="220" height="44">
  <title>Aperture — constellation client</title>
  <style>
    .wm-name { fill: #F4F2FB; }
    .wm-sub  { fill: #9CA3AF; }
    @media (prefers-color-scheme: light) {
      .wm-name { fill: #1A1333; }
      .wm-sub  { fill: #6D28D9; }
    }
  </style>
  <defs>
    <linearGradient id="wm-blade-a" gradientUnits="userSpaceOnUse" x1="6" y1="11" x2="26" y2="33">
      <stop offset="0%" stop-color="#C4A5FB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="wm-blade-b" gradientUnits="userSpaceOnUse" x1="6" y1="11" x2="26" y2="33">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <radialGradient id="wm-throat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4F2FB" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#C4A5FB" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="wm-housing">
      <circle cx="16" cy="22" r="11.2"/>
    </clipPath>
  </defs>

  <!-- Mark tile -->
  <rect x="0" y="6" width="32" height="32" rx="6.5" fill="#110E22"/>
  <rect x="0.5" y="6.5" width="31" height="31" rx="6.2" fill="none" stroke="#A855F7" stroke-opacity="0.22" stroke-width="1"/>

  <circle cx="16" cy="22" r="6.5" fill="url(#wm-throat)"/>

  <g clip-path="url(#wm-housing)">
    <path d="M22.2 22 L19.47 16.86 L21.41 -3.43 L40.11 12.26 Z" fill="url(#wm-blade-a)"/>
    <path d="M19.1 16.63 L13.28 16.43 L-3.32 4.6 L19.62 -3.75 Z" fill="url(#wm-blade-b)"/>
    <path d="M12.9 16.63 L9.82 21.57 L-8.73 30.03 L-4.49 5.99 Z" fill="url(#wm-blade-a)"/>
    <path d="M9.8 22 L12.53 27.14 L10.59 47.43 L-8.11 31.74 Z" fill="url(#wm-blade-b)"/>
    <path d="M12.9 27.37 L18.72 27.57 L35.32 39.4 L12.38 47.75 Z" fill="url(#wm-blade-a)"/>
    <path d="M19.1 27.37 L22.18 22.43 L40.73 13.97 L36.49 38.01 Z" fill="url(#wm-blade-b)"/>
  </g>

  <path d="M22.2 22 L19.1 16.63 L12.9 16.63 L9.8 22 L12.9 27.37 L19.1 27.37 Z"
        fill="none" stroke="#DDC9FD" stroke-opacity="0.7" stroke-width="0.35"/>
  <circle cx="16" cy="22" r="11.2" fill="none" stroke="#A855F7" stroke-opacity="0.4" stroke-width="0.9"/>
  <circle cx="16" cy="22" r="1" fill="#F4F2FB" opacity="0.95"/>

  <!-- Wordmark -->
  <text x="42" y="21" class="wm-name" fill="#F4F2FB"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="17" font-weight="600" letter-spacing="0.68">Aperture</text>

  <!-- Subtitle -->
  <text x="42.7" y="33.5" class="wm-sub" fill="#9CA3AF"
        font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace"
        font-size="9" font-weight="400" letter-spacing="0.5">constellation client</text>
</svg>
