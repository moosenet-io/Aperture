<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" width="220" height="44">
  <title>Aperture — constellation client</title>
  <style>
    .wm-name { fill: #F4F2FB; }
    .wm-sub  { fill: #9CA3AF; }
    @media (prefers-color-scheme: light) {
      .wm-name { fill: #1A1333; }
      .wm-sub  { fill: #6D28D9; }
    }
  </style>
  <defs>
    <linearGradient id="wm-blade" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#C4A5FB"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <radialGradient id="wm-throat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DDC9FD" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="wm-housing">
      <circle cx="16" cy="22" r="10.6"/>
    </clipPath>
  </defs>

  <!-- Mark container (self-lit tile keeps the mark legible on light or dark) -->
  <rect x="0" y="6" width="32" height="32" rx="6.5" fill="#110E22"/>
  <rect x="0.5" y="6.5" width="31" height="31" rx="6.2" fill="none" stroke="#A855F7" stroke-opacity="0.22" stroke-width="1"/>

  <circle cx="16" cy="22" r="7.6" fill="url(#wm-throat)"/>

  <g clip-path="url(#wm-housing)" fill="url(#wm-blade)">
    <path d="M19.9 22 L18.29 18.84 L23.17 -2.99 L40.43 13.11 Z" opacity="0.94"/>
    <path d="M17.95 18.62 L14.41 18.44 L-2.06 3.3 L20.51 -3.61 Z"/>
    <path d="M14.05 18.62 L12.12 21.59 L-9.23 28.29 L-3.92 5.29 Z" opacity="0.9"/>
    <path d="M12.1 22 L13.71 25.16 L8.83 46.99 L-8.43 30.89 Z" opacity="0.84"/>
    <path d="M14.05 25.38 L17.59 25.56 L34.06 40.7 L11.49 47.61 Z" opacity="0.8"/>
    <path d="M17.95 25.38 L19.88 22.41 L41.23 15.71 L35.92 38.71 Z" opacity="0.88"/>
  </g>

  <circle cx="16" cy="22" r="10.6" fill="none" stroke="#A855F7" stroke-opacity="0.4" stroke-width="0.9"/>
  <circle cx="16" cy="22" r="1.5" fill="#F4F2FB" opacity="0.92"/>

  <!-- Wordmark -->
  <text x="42" y="21" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600" class="wm-name" fill="#F4F2FB" letter-spacing="0.68">Aperture</text>

  <!-- Subtitle -->
  <text x="42.7" y="33.5" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="9" font-weight="400" class="wm-sub" fill="#9CA3AF" letter-spacing="0.5">constellation client</text>
</svg>
