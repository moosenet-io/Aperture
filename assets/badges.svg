<svg xmlns="http://www.w3.org/2000/svg" width="800" height="40" viewBox="0 0 800 40"
     font-family="'DejaVu Sans', Verdana, Helvetica, sans-serif" font-size="11">
  <title>Aperture — status badges</title>
  <defs>
    <linearGradient id="ap-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- build / passing -->
  <g transform="translate(15,0)">
    <rect x="0" y="8" width="116" height="22" rx="5" fill="#2a2342"/>
    <rect x="52" y="8" width="64" height="22" rx="5" fill="#10b981"/><rect x="52" y="8" width="12" height="22" fill="#10b981"/>
    <rect x="0" y="8" width="116" height="11" rx="5" fill="url(#ap-sheen)"/>
    <text x="26" y="23" text-anchor="middle" fill="#c7c3d6">build</text>
    <text x="84" y="23" text-anchor="middle" fill="#062b1f" font-weight="bold">passing</text>
  </g>

  <!-- tests / pending (no suite yet) -->
  <g transform="translate(151,0)">
    <rect x="0" y="8" width="116" height="22" rx="5" fill="#2a2342"/>
    <rect x="52" y="8" width="64" height="22" rx="5" fill="#f59e0b"/><rect x="52" y="8" width="12" height="22" fill="#f59e0b"/>
    <rect x="0" y="8" width="116" height="11" rx="5" fill="url(#ap-sheen)"/>
    <text x="26" y="23" text-anchor="middle" fill="#c7c3d6">tests</text>
    <text x="84" y="23" text-anchor="middle" fill="#3a2405" font-weight="bold">pending</text>
  </g>

  <!-- targets -->
  <g transform="translate(287,0)">
    <rect x="0" y="8" width="225" height="22" rx="5" fill="#2a2342"/>
    <rect x="64" y="8" width="161" height="22" rx="5" fill="#7c3aed"/><rect x="64" y="8" width="12" height="22" fill="#7c3aed"/>
    <rect x="0" y="8" width="225" height="11" rx="5" fill="url(#ap-sheen)"/>
    <text x="32" y="23" text-anchor="middle" fill="#c7c3d6">targets</text>
    <text x="144" y="23" text-anchor="middle" fill="#ffffff" font-weight="bold">web · desktop · mobile</text>
  </g>

  <!-- licence -->
  <g transform="translate(532,0)">
    <rect x="0" y="8" width="108" height="22" rx="5" fill="#2a2342"/>
    <rect x="64" y="8" width="44" height="22" rx="5" fill="#3b82f6"/><rect x="64" y="8" width="12" height="22" fill="#3b82f6"/>
    <rect x="0" y="8" width="108" height="11" rx="5" fill="url(#ap-sheen)"/>
    <text x="32" y="23" text-anchor="middle" fill="#c7c3d6">licence</text>
    <text x="86" y="23" text-anchor="middle" fill="#ffffff" font-weight="bold">MIT</text>
  </g>

  <!-- telemetry -->
  <g transform="translate(660,0)">
    <rect x="0" y="8" width="125" height="22" rx="5" fill="#2a2342"/>
    <rect x="77" y="8" width="48" height="22" rx="5" fill="#10b981"/><rect x="77" y="8" width="12" height="22" fill="#10b981"/>
    <rect x="0" y="8" width="125" height="11" rx="5" fill="url(#ap-sheen)"/>
    <text x="38" y="23" text-anchor="middle" fill="#c7c3d6">telemetry</text>
    <text x="101" y="23" text-anchor="middle" fill="#062b1f" font-weight="bold">none</text>
  </g>
</svg>
