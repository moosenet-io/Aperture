<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>Aperture — the constellation client</title>
  <defs>
    <radialGradient id="bn-space" cx="50%" cy="37%" r="78%">
      <stop offset="0%" stop-color="#241A3F"/>
      <stop offset="46%" stop-color="#1A1430"/>
      <stop offset="100%" stop-color="#0D0A1C"/>
    </radialGradient>
    <radialGradient id="bn-sigilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.55"/>
      <stop offset="38%" stop-color="#7C3AED" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#5B21B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bn-titleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5B21B6" stop-opacity="0.5"/>
      <stop offset="58%" stop-color="#3A2A6E" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3A2A6E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bn-throat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="20%" stop-color="#DDC9FD" stop-opacity="0.5"/>
      <stop offset="58%" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bn-blade-a" gradientUnits="userSpaceOnUse" x1="556" y1="150" x2="726" y2="332">
      <stop offset="0%" stop-color="#C4A5FB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="bn-blade-b" gradientUnits="userSpaceOnUse" x1="556" y1="150" x2="726" y2="332">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <clipPath id="bn-housing">
      <circle cx="640" cy="240" r="96"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#bn-space)"/>

  <!-- starfield -->
  <g fill="#FFFFFF">
    <circle cx="317" cy="112" r="1.2" opacity="0.37"/><circle cx="46" cy="608" r="0.7" opacity="0.4"/><circle cx="869" cy="205" r="1.2" opacity="0.43"/><circle cx="264" cy="547" r="1.1" opacity="0.53"/>
    <circle cx="931" cy="585" r="0.8" opacity="0.46"/><circle cx="272" cy="348" r="1.1" opacity="0.55"/><circle cx="1135" cy="353" r="1.3" opacity="0.33"/><circle cx="427" cy="95" r="0.8" opacity="0.6"/>
    <circle cx="1047" cy="244" r="0.8" opacity="0.33"/><circle cx="169" cy="147" r="1.4" opacity="0.59"/><circle cx="54" cy="23" r="1.2" opacity="0.54"/><circle cx="1153" cy="598" r="1.3" opacity="0.37"/>
    <circle cx="1110" cy="148" r="1.0" opacity="0.38"/><circle cx="57" cy="179" r="0.8" opacity="0.3"/><circle cx="814" cy="298" r="1.1" opacity="0.4"/><circle cx="975" cy="248" r="0.9" opacity="0.34"/>
    <circle cx="55" cy="432" r="1.4" opacity="0.55"/><circle cx="385" cy="224" r="1.3" opacity="0.3"/><circle cx="171" cy="359" r="1.3" opacity="0.39"/><circle cx="360" cy="563" r="1.2" opacity="0.42"/>
    <circle cx="1249" cy="448" r="1.3" opacity="0.43"/><circle cx="1163" cy="287" r="0.8" opacity="0.33"/><circle cx="487" cy="129" r="1.1" opacity="0.51"/><circle cx="1020" cy="155" r="1.3" opacity="0.33"/>
    <circle cx="128" cy="29" r="0.9" opacity="0.31"/><circle cx="1068" cy="398" r="1.3" opacity="0.38"/><circle cx="512" cy="619" r="0.9" opacity="0.42"/><circle cx="1016" cy="504" r="0.7" opacity="0.33"/>
    <circle cx="626" cy="43" r="0.8" opacity="0.49"/><circle cx="286" cy="222" r="1.0" opacity="0.39"/><circle cx="362" cy="172" r="0.7" opacity="0.43"/><circle cx="1210" cy="312" r="1.2" opacity="0.37"/>
    <circle cx="1063" cy="344" r="1.1" opacity="0.39"/><circle cx="548" cy="54" r="0.9" opacity="0.42"/><circle cx="843" cy="501" r="1.0" opacity="0.4"/><circle cx="32" cy="250" r="0.7" opacity="0.45"/>
    <circle cx="1112" cy="59" r="1.2" opacity="0.32"/><circle cx="1189" cy="65" r="1.0" opacity="0.31"/><circle cx="59" cy="125" r="0.7" opacity="0.45"/><circle cx="470" cy="53" r="0.9" opacity="0.42"/>
  </g>

  <!-- eyebrow -->
  <text x="640" y="86" text-anchor="middle" fill="#C4A5FB" fill-opacity="0.82"
        font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace"
        font-size="13" letter-spacing="2.34">WEB · DESKTOP · MOBILE</text>

  <!-- glow behind the sigil -->
  <circle cx="640" cy="240" r="238" fill="url(#bn-sigilGlow)"/>

  <!-- inbound client surfaces (blue = source) -->
  <g stroke="#3B82F6" stroke-width="1.4" opacity="0.42">
    <line x1="452.8" y1="140.5" x2="542.9" y2="188.3"/>
    <line x1="428" y1="240" x2="530" y2="240"/>
    <line x1="452.8" y1="339.5" x2="542.9" y2="291.7"/>
  </g>
  <!-- outbound kernel endpoints (green = endpoint) -->
  <g stroke="#10B981" stroke-width="1.4" opacity="0.36">
    <line x1="827.2" y1="140.5" x2="737.1" y2="188.3"/>
    <line x1="852" y1="240" x2="750" y2="240"/>
    <line x1="827.2" y1="339.5" x2="737.1" y2="291.7"/>
  </g>
  <g>
    <circle cx="452.8" cy="140.5" r="5.5" fill="#3B82F6"/>
    <circle cx="428" cy="240" r="6.5" fill="#3B82F6"/>
    <circle cx="452.8" cy="339.5" r="5.5" fill="#3B82F6"/>
    <circle cx="827.2" cy="140.5" r="5" fill="#10B981" opacity="0.9"/>
    <circle cx="852" cy="240" r="6" fill="#10B981" opacity="0.9"/>
    <circle cx="827.2" cy="339.5" r="5" fill="#10B981" opacity="0.9"/>
  </g>

  <!-- ===== APERTURE SIGIL ===== -->
  <circle cx="640" cy="240" r="56" fill="url(#bn-throat)"/>
  <g clip-path="url(#bn-housing)">
    <path d="M693 240 L669.3 195.8 L687.8 4.8 L862.5 150.1 Z" fill="url(#bn-blade-a)"/>
    <path d="M666.5 194.1 L616.4 192.6 L460.3 81 L673.4 2.3 Z" fill="url(#bn-blade-b)"/>
    <path d="M613.5 194.1 L587.1 236.8 L412.4 316.2 L450.9 92.2 Z" fill="url(#bn-blade-a)"/>
    <path d="M587 240 L610.7 284.2 L592.2 475.2 L417.5 329.9 Z" fill="url(#bn-blade-b)"/>
    <path d="M613.5 285.9 L663.6 287.4 L819.7 399 L606.6 477.7 Z" fill="url(#bn-blade-a)"/>
    <path d="M666.5 285.9 L692.9 243.2 L867.6 163.8 L829.1 387.8 Z" fill="url(#bn-blade-b)"/>
  </g>
  <!-- opening edge -->
  <path d="M693 240 L666.5 194.1 L613.5 194.1 L587 240 L613.5 285.9 L666.5 285.9 Z"
        fill="none" stroke="#DDC9FD" stroke-opacity="0.65" stroke-width="1.2"/>
  <!-- housing rings -->
  <circle cx="640" cy="240" r="96" fill="none" stroke="#A855F7" stroke-opacity="0.45" stroke-width="1.6"/>
  <circle cx="640" cy="240" r="106" fill="none" stroke="#A855F7" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="640" cy="240" r="120" fill="none" stroke="#A855F7" stroke-opacity="0.14" stroke-width="1"/>
  <!-- core light -->
  <circle cx="640" cy="240" r="6" fill="#F4F2FB" opacity="0.95"/>

  <!-- ===== TITLE ===== -->
  <ellipse cx="640" cy="404" rx="330" ry="72" fill="url(#bn-titleGlow)"/>
  <text x="640" y="424" text-anchor="middle" fill="#F4F2FB"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="64" font-weight="600" letter-spacing="2.56">Aperture</text>
  <text x="640" y="464" text-anchor="middle" fill="#C7C3D6"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" font-weight="400" letter-spacing="0.3">A thin luminous client over a fat sovereign backend.</text>

  <!-- ===== FOOTER: module surfaces ===== -->
  <g>
    <line x1="424" y1="536" x2="856" y2="536" stroke="#A855F7" stroke-opacity="0.14" stroke-width="1"/>
    <circle cx="512" cy="536" r="3" fill="#A855F7" opacity="0.7"/>
    <circle cx="640" cy="536" r="3" fill="#A855F7" opacity="0.7"/>
    <circle cx="768" cy="536" r="3" fill="#A855F7" opacity="0.7"/>
    <text x="512" y="562" text-anchor="middle" fill="#9CA3AF"
          font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace"
          font-size="11.5" letter-spacing="2.07">ASSISTANT</text>
    <text x="640" y="562" text-anchor="middle" fill="#9CA3AF"
          font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace"
          font-size="11.5" letter-spacing="2.07">MUSE</text>
    <text x="768" y="562" text-anchor="middle" fill="#9CA3AF"
          font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace"
          font-size="11.5" letter-spacing="2.07">HARMONY</text>
  </g>
</svg>
